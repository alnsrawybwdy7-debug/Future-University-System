<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول الشبكة الجامعية</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; width: 320px; position: relative; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .logo { font-size: 50px; margin-bottom: 10px; }
        .developer-tag { margin-top: 20px; font-size: 13px; color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🌐</div>
        <h2>الشبكة الجامعية</h2>
        <p>يرجى تسجيل الدخول للاستمرار</p>
        <form action="" method="POST">
            <input type="text" name="user_id" placeholder="اسم المستخدم أو الرقم الجامعي" required>
            <input type="password" name="user_pass" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل دخول</button>
        </form>
        <div class="developer-tag">
            Developed by: Abdullah Abd-Alsalam Abd-Al-Redha
        </div>
    </div>
</body>
</html>
